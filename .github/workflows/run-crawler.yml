name: Hedron Crawler

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Offset from :00 — GitHub delays workflows that pile up on the hour.
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: hedron-crawler
  # A run cancelled between the Hugging Face push and the deploy would leave
  # the site stale, since the next run sees no change and skips deploying.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.crawl.outputs.deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing floating major tags in v8.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync

      - name: Run crawl pipeline
        id: crawl
        env:
          TOKEN: ${{ secrets.TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python crawl.py ${{ github.event_name == 'push' && '--build-only' || '' }}

      # crawl.py sets the output only after the data was pulled and rebuilt, so
      # a crawl that later exits non-zero still ships, but a failed pull never
      # deploys an empty site.
      - name: Stage site
        if: ${{ !cancelled() && steps.crawl.outputs.deploy == 'true' }}
        run: rsync -a --exclude='.*' --exclude=_site ./ _site/

      - name: Upload site
        if: ${{ !cancelled() && steps.crawl.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: crawl
    if: ${{ !cancelled() && needs.crawl.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
