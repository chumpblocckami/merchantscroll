<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dies to Cut Down</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #181b22;
      --text: #ece7df;
      --muted: #9aa3b2;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #d4b06a;
      --white: #f8f6d8;
      --blue: #0e68ab;
      --black: #150b0d;
      --red: #d3202a;
      --green: #00733e;
      --colorless: #c8ccd4;
      --multicolor: linear-gradient(135deg, #d4af37, #00733e, #0e68ab, #d3202a);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --font: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(212, 176, 106, 0.12), transparent 28rem),
        linear-gradient(180deg, #0d1015 0%, #111318 100%);
      font-family: var(--font);
    }

    .wrap {
      width: min(1400px, calc(100vw - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.02em;
      font-weight: 600;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 70ch;
      line-height: 1.5;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0 2rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .summary-table th,
    .summary-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    .summary-table th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
    }

    .summary-table tr:last-child td {
      border-bottom: none;
      font-weight: 700;
      background: rgba(212, 176, 106, 0.08);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .mana {
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
    }

    .mana-W {
      background: #f0e68c;
      color: #222;
    }

    .mana-U {
      background: var(--blue);
    }

    .mana-B {
      background: var(--black);
    }

    .mana-R {
      background: var(--red);
    }

    .mana-G {
      background: var(--green);
    }

    .mana-C {
      background: #5f6673;
    }

    .mana-M {
      background: conic-gradient(#f0e68c, #0e68ab, #150b0d, #d3202a, #00733e, #f0e68c);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
      gap: 1rem;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 18rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .panel-head {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .panel-head h2 {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 1.1rem;
    }

    .panel-count {
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--accent);
      white-space: nowrap;
    }

    .card-list {
      list-style: none;
      margin: 0;
      padding: 0.75rem;
      overflow: auto;
      max-height: 28rem;
    }

    .card-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.42rem 0.55rem;
      border-radius: 8px;
      cursor: default;
    }

    .card-list li:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .card-name {
      color: var(--text);
    }

    .card-stats {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .card-reason {
      display: block;
      margin-top: 0.15rem;
      color: #c9a96a;
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .card-deck-meta {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.4;
    }

    .card-list li.has-reason {
      flex-direction: column;
      align-items: stretch;
    }

    .card-list li.has-reason .card-row {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .empty {
      padding: 1rem;
      color: var(--muted);
      font-style: italic;
    }

    .view-toggle {
      display: inline-flex;
      gap: 0.35rem;
      padding: 0.35rem;
      margin: 1rem 0 0.25rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
    }

    .view-toggle button {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.95rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .view-toggle button.active {
      background: rgba(212, 176, 106, 0.18);
      color: var(--text);
    }

    .view-toggle button:hover:not(.active) {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    #card-preview {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      display: none;
      width: min(320px, calc(100vw - 2rem));
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0b0d11;
    }

    #card-preview img {
      display: block;
      width: 100%;
      height: auto;
    }

    #card-context {
      padding: 0.8rem 0.9rem 0.95rem;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    #card-context h3 {
      margin: 0 0 0.45rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    #card-context dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.2rem 0.75rem;
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--muted);
    }

    #card-context dt {
      color: #7f8794;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.68rem;
    }

    #card-context dd {
      margin: 0;
      color: var(--text);
    }

    @media (max-width: 720px) {
      .wrap {
        width: min(100vw - 1rem, 1400px);
      }

      .card-list {
        max-height: 20rem;
      }
    }
  </style>
</head>

": ["R", "W"], "type_line": "Creature — Spirit Ox", "reason": "repeatable growth; +1/+1 counters", "decks": { "decklists": 93, "copies": 354, "main": 93, "side": 0, "first": "2026-04-21", "last": "2026-08-20", "events": [["league", 51], ["challenge", 37], ["irl", 5]], "archetypes": [["Tireless Tribe", 92], ["Rakdos Madness", 1]] } }, { "name": "Writhing Chrysalis", "lookup_name": "Writhing Chrysalis", "image_url": "https://cards.scryfall.io/normal/front/f/5/f54dbeb1-51f8-40e2-912a-ec25457de5a2.jpg?1783911244", "power": 2, "toughness": 3, "total": 5, "colors": ["G", "R"], "type_line": "Creature — Eldrazi Drone", "reason": "repeatable growth; +1/+1 counters", "decks": { "decklists": 3004, "copies": 11882, "main": 2807, "side": 199, "first": "2023-09-16", "last": "2026-09-10", "events": [["challenge", 1397], ["league", 1364], ["irl", 131], ["other", 91]], "archetypes": [["Jund Wildfire", 1435], ["Gruul Ponza", 444], ["Gruul Monsters", 421], ["Naya Gates", 173], ["Spy Combo", 157]] } }], "survives": [{ "name": "Architects of Will", "lookup_name": "Architects of Will", "image_url": "https://cards.scryfall.io/normal/front/6/f/6f614bb4-92e3-4ae0-9f2f-294434706c48.jpg?1783941899", "power": 3, "toughness": 3, "total": 6, "colors": ["B", "U"], "type_line": "Artifact Creature — Human Wizard", "reason": "", "decks": { "decklists": 4, "copies": 15, "main": 4, "side": 0, "first": "2025-05-31", "last": "2026-07-09", "events": [["league", 3], ["challenge", 1]], "archetypes": [["Cycling Storm", 4]] } }, { "name": "Dinrova Horror", "lookup_name": "Dinrova Horror", "image_url": "https://cards.scryfall.io/normal/front/7/d/7da93bf0-2075-4e36-b69b-3db3d4288e7a.jpg?1783930346", "power": 4, "toughness": 4, "total": 8, "colors": ["B", "U"], "type_line": "Creature — Horror", "reason": "", "decks": { "decklists": 127, "copies": 135, "main": 19, "side": 108, "first": "2024-06-03", "last": "2026-09-07", "events": [["league", 77], ["challenge", 48], ["other", 2]], "archetypes": [["Flicker Tron", 126], ["Jeskai Ephemerate", 1]] } }, { "name": "Foot Ninjas", "lookup_name": "Foot Ninjas", "image_url": "https://cards.scryfall.io/normal/front/a/b/abb1ab9c-b067-4b75-8e5b-a893b7948df1.jpg?1783904077", "power": 5, "toughness": 5, "total": 10, "colors": ["B", "W"], "type_line": "Creature — Human Ninja", "reason": "", "decks": { "decklists": 36, "copies": 60, "main": 35, "side": 1, "first": "2026-03-22", "last": "2026-08-18", "events": [["league", 21], ["challenge", 13], ["other", 1], ["irl", 1]], "archetypes": [["Orzhov Refurbished", 31], ["Orzhov Blade", 5]] } }, { "name": "Monstrous Carabid", "lookup_name": "Monstrous Carabid", "image_url": "https://cards.scryfall.io/normal/front/b/0/b09e668d-02ca-4164-88ee-c7ea6c665975.jpg?1783942433", "power": 4, "toughness": 4, "total": 8, "colors": ["B", "R"], "type_line": "Creature — Insect", "reason": "", "decks": { "decklists": 96, "copies": 328, "main": 96, "side": 0, "first": "2024-06-03", "last": "2026-09-06", "events": [["league", 61], ["challenge", 20], ["other", 8], ["irl", 7]], "archetypes": [["Cycling Storm", 96]] } }, { "name": "Slippery Bogle", "lookup_name": "Slippery Bogle", "image_url": "https://cards.scryfall.io/normal/front/c/4/c4e4bbea-7e3f-4de0-bb01-dfd67f21c254.jpg?1783933766", "power": 1, "toughness": 1, "total": 2, "colors": ["G", "U"], "type_line": "Creature — Beast", "reason": "hexproof", "decks": { "decklists": 289, "copies": 1156, "main": 289, "side": 0, "first": "2025-05-02", "last": "2026-09-09", "events": [["challenge", 169], ["league", 111], ["other", 4], ["irl", 4]], "archetypes": [["Bogles", 289]] } }], "unknown": [] } } };

    const preview = document.getElementById("card-preview");
    const previewImg = document.getElementById("card-preview-img");
    const cardContext = document.getElementById("card-context");
    const imageCache = new Map();
    const cardByName = new Map();
    let currentView = "dies";

    for (const bucket of Object.values(DATA.buckets)) {
      for (const cards of Object.values(bucket)) {
        if (!Array.isArray(cards)) continue;
        for (const card of cards) {
          cardByName.set(card.name, card);
          cardByName.set(card.lookup_name, card);
        }
      }
    }

    function escapeAttr(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/</g, "&lt;");
    }

    function formatDateRange(first, last) {
      if (!first && !last) return "unknown dates";
      if (first === last) return first;
      return `${first} to ${last}`;
    }

    function formatDeckMeta(decks) {
      if (!decks || !decks.decklists) return "";
      const range = formatDateRange(decks.first, decks.last);
      const tops = (decks.archetypes || [])
        .slice(0, 2)
        .map(([name]) => name)
        .join(", ");
      const suffix = tops ? ` · ${tops}` : "";
      return `${decks.decklists.toLocaleString()} decks · ${range}${suffix}`;
    }

    function formatEventList(events) {
      if (!events || !events.length) return "—";
      return events.map(([name, count]) => `${name} (${count})`).join(", ");
    }

    function formatArchetypeList(archetypes) {
      if (!archetypes || !archetypes.length) return "—";
      return archetypes.map(([name, count]) => `${name} (${count})`).join(", ");
    }

    function renderCardContext(card) {
      if (!card || !card.decks || !card.decks.decklists) {
        cardContext.innerHTML = "";
        return;
      }
      const decks = card.decks;
      cardContext.innerHTML = `
        <h3>${card.name}</h3>
        <dl>
          <dt>Decks</dt><dd>${decks.decklists.toLocaleString()} lists · ${decks.copies.toLocaleString()} copies</dd>
          <dt>Window</dt><dd>${formatDateRange(decks.first, decks.last)}</dd>
          <dt>Events</dt><dd>${formatEventList(decks.events)}</dd>
          <dt>Archetypes</dt><dd>${formatArchetypeList(decks.archetypes)}</dd>
          <dt>Zones</dt><dd>Main ${decks.main.toLocaleString()} · Side ${decks.side.toLocaleString()}</dd>
        </dl>`;
    }

    const VIEWS = {
      dies: {
        title: "dies to cut down",
        bucketKey: "dies",
        emptyText: "No creatures in this slice always die to Cut Down.",
        panelCount(row) {
          return `${row.dies} / ${row.total}`;
        },
        showReason: true,
      },
      might_die: {
        title: "might die to cut down",
        bucketKey: "might_die",
        emptyText: "No conditional creatures in this slice.",
        panelCount(row) {
          return `${row.might_die} / ${row.total}`;
        },
        showReason: true,
      },
      survives: {
        title: "survives cut down",
        bucketKey: "survives",
        emptyText: "No creatures in this slice survive Cut Down.",
        panelCount(row) {
          return `${row.survives} / ${row.total}`;
        },
        showReason: true,
      },
    };

    function manaChip(symbol, label) {
      const letter = symbol === "C" ? "◯" : symbol === "M" ? "★" : symbol;
      return (
        `<span class="chip"><span class="mana mana-${symbol}">${letter}</span>`
        + `${label}</span>`
      );
    }

    function scryfallImageUrl(name) {
      const base = "https://api.scryfall.com/cards/named";
      const query = `exact=${encodeURIComponent(name)}&format=image&version=normal`;
      return `${base}?${query}`;
    }

    function previewImageUrl(card) {
      if (card.image_url) return card.image_url;
      const cached = imageCache.get(card.lookup_name);
      if (cached) return cached;
      const fallback = scryfallImageUrl(card.lookup_name);
      imageCache.set(card.lookup_name, fallback);
      return fallback;
    }

    function showPreview(cardKey, event) {
      const card = cardByName.get(cardKey);
      if (!card) return;
      renderCardContext(card);
      previewImg.alt = card.name;
      previewImg.src = previewImageUrl(card);
      preview.style.display = "block";
      movePreview(event);
    }

    function movePreview(event) {
      const offset = 18;
      const width = preview.offsetWidth || 320;
      const height = preview.offsetHeight || 420;
      let x = event.clientX + offset;
      let y = event.clientY + offset;
      if (x + width > window.innerWidth) x = event.clientX - width - offset;
      if (y + height > window.innerHeight) y = event.clientY - height - offset;
      preview.style.left = `${x}px`;
      preview.style.top = `${y}px`;
    }

    function hidePreview() {
      preview.style.display = "none";
      cardContext.innerHTML = "";
    }

    function renderSummary() {
      const body = document.getElementById("summary-body");
      body.innerHTML = DATA.summary.by_color.map((row) => `
        <tr>
          <td>${manaChip(row.symbol, row.label)}</td>
          <td>${row.dies}</td>
          <td>${row.might_die}</td>
          <td>${row.survives}</td>
          <td>${row.total}</td>
          <td>${row.die_pct}%</td>
          <td>${row.might_die_pct}%</td>
          <td>${row.survive_pct}%</td>
        </tr>
      `).join("") + `
        <tr>
          <td><strong>Overall</strong></td>
          <td>${DATA.summary.overall.dies}</td>
          <td>${DATA.summary.overall.might_die}</td>
          <td>${DATA.summary.overall.survives}</td>
          <td>${DATA.summary.overall.total}</td>
          <td>${DATA.summary.overall.die_pct}%</td>
          <td>${DATA.summary.overall.might_die_pct}%</td>
          <td>${DATA.summary.overall.survive_pct}%</td>
        </tr>`;
    }

    function renderPanels() {
      const view = VIEWS[currentView];
      const grid = document.getElementById("grid");
      grid.innerHTML = DATA.summary.by_color.map((row) => {
        const bucket = DATA.buckets[row.key];
        const cards = bucket[view.bucketKey].slice().sort((a, b) => {
          const deckDiff = (b.decks?.decklists || 0) - (a.decks?.decklists || 0);
          return deckDiff !== 0 ? deckDiff : a.name.localeCompare(b.name);
        });
        const list = cards.length
          ? cards.map((card) => {
            const reason = view.showReason && card.reason
              ? `<span class="card-reason">${card.reason}</span>`
              : "";
            const deckMeta = formatDeckMeta(card.decks);
            const deckLine = deckMeta
              ? `<span class="card-deck-meta">${deckMeta}</span>`
              : "";
            const rowClass = reason || deckMeta ? "has-reason" : "";
            return `
              <li class="${rowClass}"
                  data-card="${escapeAttr(card.name)}">
                <div class="card-row">
                  <span class="card-name">${card.name}</span>
                  <span class="card-stats">${card.power}/${card.toughness}</span>
                </div>
                ${deckLine}
                ${reason}
              </li>`;
          }).join("")
          : `<li class="empty">${view.emptyText}</li>`;
        return `
          <section class="panel">
            <div class="panel-head">
              <h2>
                ${manaChip(row.symbol, row.label)}
                <span class="panel-count">${view.panelCount(row)}</span>
              </h2>
            </div>
            <ul class="card-list">${list}</ul>
          </section>`;
      }).join("");

      grid.querySelectorAll(".card-list li[data-card]").forEach((item) => {
        item.addEventListener("mouseenter", (event) => {
          showPreview(item.dataset.card, event);
        });
        item.addEventListener("mousemove", movePreview);
        item.addEventListener("mouseleave", hidePreview);
      });
    }

    function setView(viewName) {
      currentView = viewName;
      const view = VIEWS[viewName];
      document.getElementById("page-title").textContent = view.title;
      for (const name of ["dies", "might_die", "survives"]) {
        const active = viewName === name;
        const button = document.getElementById(`view-${name.replace("_", "-")}`);
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
      }
      renderPanels();
    }

    function renderMeta() {
      const overall = DATA.summary.overall;
      const subtitle = document.getElementById("subtitle");
      const analysis = DATA.analysis || {};
      const analysisWindow = formatDateRange(analysis.first_date, analysis.last_date);
      subtitle.textContent =
        `${DATA.unique_creatures} Pauper creatures from `
        + `${analysis.tournaments?.toLocaleString() || "?"} tournaments, `
        + `${analysis.decklists?.toLocaleString() || "?"} decklists `
        + `(${analysisWindow}). Hover a card for deck context.`;
      const footer = document.getElementById("footer");
      footer.textContent =
        `Generated ${new Date(DATA.generated_at).toLocaleString()} · `
    }

    document.getElementById("view-dies").addEventListener("click", () => setView("dies"));
    document.getElementById("view-might-die").addEventListener("click", () => setView("might_die"));
    document.getElementById("view-survives").addEventListener("click", () => setView("survives"));

    renderSummary();
    renderPanels();
    renderMeta();
  </script>
